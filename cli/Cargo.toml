[package]
name = "cachebay-cli"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "GraphQL codegen for the Cachebay Swift client"
license = "MIT"

[[bin]]
name = "cachebay-cli"
path = "src/main.rs"

[dependencies]
# GraphQL parser + validator from Apollo. Spec-compliant, error-recovering,
# lossless CST. We use the HIR (`apollo-compiler`) for validated operations.
apollo-compiler = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Filesystem / globbing
walkdir = "2"

# Introspection HTTP client — minimal, blocking, no async runtime.
# `rustls` rather than native-tls so the CLI builds without OpenSSL on
# fresh dev boxes (we hit localhost in dev and HTTPS in prod).
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

# Introspection request/response shaping.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
