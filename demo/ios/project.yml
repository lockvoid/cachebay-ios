name: HarryPotterDemo
options:
  bundleIdPrefix: com.lockvoid.cachebay
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  Cachebay:
    path: ../../

targets:
  HarryPotterDemo:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: HarryPotterDemo
        excludes:
          - "**/*.graphql"
    dependencies:
      - package: Cachebay
        product: Cachebay
      - package: Cachebay
        product: CachebayUI
      - package: Cachebay
        product: CachebayMacros
    info:
      path: HarryPotterDemo/Info.plist
      properties:
        CFBundleDisplayName: Harry Potter
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lockvoid.cachebay.HarryPotterDemo
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: "\"HarryPotterDemo/Preview Content\""
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
