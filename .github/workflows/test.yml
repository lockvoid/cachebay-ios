name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: swift test (macOS, Swift 6)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # macos-14 ships Xcode 15.x; pin a recent version with Swift 6 support.
        run: sudo xcode-select -s /Applications/Xcode_16.0.app

      - name: Swift version
        run: swift --version

      - name: Cache .build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

  lint:
    name: SwiftFormat (lint)
    runs-on: macos-14
    if: false  # enable once a swiftformat config is in place
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftformat
      - run: swiftformat --lint Sources Tests
