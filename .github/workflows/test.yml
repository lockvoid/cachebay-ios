name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: swift test (macOS, Swift 6)
    # macos-15 (Sequoia) ships Xcode 16.x by default — required for
    # Swift 6 mode (`.swiftLanguageMode(.v6)`) and iOS 16+ Duration /
    # Clock APIs. macos-14 ships Xcode 15.x which doesn't have Swift 6.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      # Package.swift is `swift-tools-version:6.2` (Xcode 26). The runner's
      # DEFAULT Xcode is 16.x → Swift 6.1, which can't even load a 6.2 manifest
      # ("package is using Swift tools version 6.2.0 but the installed version
      # is 6.1.0"). GitHub images install multiple Xcodes at /Applications;
      # select the newest with built-in xcode-select — no third-party action.
      # If the macos-15 image lacks Xcode 26, switch this job to runs-on: macos-26.
      - name: Select newest Xcode (Swift 6.2)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version

      - name: Cache .build
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

  lint:
    # Apple's swift-format, bundled in the toolchain — no brew, no third-party
    # action. ENFORCING (fails CI on findings): the tree was reformatted once
    # with `swift format --in-place`, so it's clean. Tune via `.swift-format`.
    # Generated code (GeneratedSmoke/*.cachebay output) is excluded — it carries
    # the CLI's own formatting and would drift on regen. (.swift-format-ignore is
    # not honored with --recursive in 6.2.x, so we exclude via an explicit list.)
    name: swift format (lint)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode (Swift 6.2 bundles swift-format)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: swift format lint (strict)
        run: |
          find Sources Tests -name '*.swift' -not -path '*/GeneratedSmoke/*' -print0 \
            | xargs -0 swift format lint --strict --parallel
