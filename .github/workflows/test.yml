name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: swift test (macOS, Swift 6)
    # macos-15 (Sequoia) ships Xcode 16.x by default — required for
    # Swift 6 mode (`.swiftLanguageMode(.v6)`) and iOS 16+ Duration /
    # Clock APIs. macos-14 ships Xcode 15.x which doesn't have Swift 6.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        # No xcode-select — use the runner's default Xcode 16.x.
        # If the default Xcode ever drops below 16, pin via
        # `maxim-lobanov/setup-xcode@v1` with `xcode-version: '16.0'`.
        run: swift --version

      - name: Cache .build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

  lint:
    name: SwiftFormat (lint)
    runs-on: macos-15
    if: false  # enable once a swiftformat config is in place
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftformat
      - run: swiftformat --lint Sources Tests
