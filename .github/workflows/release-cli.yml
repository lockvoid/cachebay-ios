name: Release cachebay-cli

# Tag-triggered: push a `vX.Y.Z` tag and this builds, signs, and notarizes the
# macOS-universal `cachebay-cli` artifact bundle, publishes it on the Release,
# and pins Package.swift to it (checksum) so consumers get the codegen plugin
# with zero install.
#
# The binaryTarget checksum must live IN the tagged commit's Package.swift, but
# it's only known after building the artifact — so we build, commit the
# checksum to main, then FORCE-MOVE the tag onto that commit. Pushes use
# GITHUB_TOKEN, whose events don't trigger new runs, so there's no loop.
#
# (workflow_dispatch is kept for manual re-runs.)
#
# Required repo secrets:
#   APPLE_CERT_P12_BASE64    base64 of a "Developer ID Application" .p12
#   APPLE_CERT_P12_PASSWORD  its password
#   APPLE_SIGN_IDENTITY      e.g. "Developer ID Application: LockVoid (TEAMID)"
#   APPLE_NOTARY_KEY_ID      App Store Connect API key id
#   APPLE_NOTARY_ISSUER_ID   App Store Connect issuer id
#   APPLE_NOTARY_KEY_P8      contents of the AuthKey_XXXX.p8

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (manual re-run, e.g. 1.2.1)"
        required: true

permissions:
  contents: write   # commit Package.swift, move the tag, create the release

jobs:
  release-cli:
    runs-on: macos-15   # cargo + codesign + notarytool + shasum; no Swift needed
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # need full history + tags to move the tag

      - name: Resolve version / tag
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"   # strip leading v from the pushed tag
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"   >> "$GITHUB_OUTPUT"

      - name: Add Rust targets (rustup is preinstalled on macOS runners)
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Import Developer ID signing certificate
        # Built-in `security` — no third-party action.
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYPASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYPASS" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYPASS" "$KEYCHAIN"
          # Put our keychain first in the search list so codesign finds the identity.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Store notarytool credentials
        run: |
          echo "${{ secrets.APPLE_NOTARY_KEY_P8 }}" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials cachebay-notary \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "${{ secrets.APPLE_NOTARY_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_NOTARY_ISSUER_ID }}"

      - name: Build + sign + notarize artifact bundle
        env:
          CACHEBAY_SIGN_ID: ${{ secrets.APPLE_SIGN_IDENTITY }}
          CACHEBAY_NOTARY_PROFILE: cachebay-notary
        run: scripts/build-cli-bundle.sh --sign

      - name: Pin Package.swift, move tag, publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          ZIP="Artifacts/cachebay-cli.artifactbundle.zip"
          CHECKSUM="$(cat "$ZIP.sha256")"

          /usr/bin/sed -i '' \
            -e 's|^let defaultCLIMode = .*|let defaultCLIMode = "release"|' \
            -e "s|^let cliReleaseTag = .*|let cliReleaseTag = \"$TAG\"|" \
            -e "s|^let cliReleaseChecksum = .*|let cliReleaseChecksum = \"$CHECKSUM\"|" \
            Package.swift

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "chore(release): pin cachebay-cli artifact for $TAG"
          git push origin HEAD:main
          # Move the tag onto the checksum commit (GITHUB_TOKEN push → no re-run).
          git tag -f "$TAG"
          git push -f origin "$TAG"

          gh release create "$TAG" "$ZIP" \
            --title "$TAG" \
            --notes "cachebay-cli $TAG — macOS-universal, signed + notarized. Used by the CachebayCodegen SwiftPM plugin." \
            || gh release upload "$TAG" "$ZIP" --clobber
