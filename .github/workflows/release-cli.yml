name: Release cachebay-cli

# Builds, signs, and notarizes the macOS-universal `cachebay-cli` artifact
# bundle, publishes it on a GitHub Release, and pins Package.swift to it so
# consumers get the codegen plugin with zero install.
#
# Trigger MANUALLY (workflow_dispatch) with the version — this avoids the
# binaryTarget checksum chicken-and-egg: we compute the checksum, commit it to
# Package.swift, THEN create the tag + release pointing at that commit.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   APPLE_CERT_P12_BASE64    base64 of a "Developer ID Application" .p12
#   APPLE_CERT_P12_PASSWORD  its password
#   APPLE_SIGN_IDENTITY      e.g. "Developer ID Application: LockVoid (TEAMID)"
#   APPLE_NOTARY_KEY_ID      App Store Connect API key id
#   APPLE_NOTARY_ISSUER_ID   App Store Connect issuer id
#   APPLE_NOTARY_KEY_P8      contents of the AuthKey_XXXX.p8

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.2.0 (no leading v)"
        required: true

permissions:
  contents: write   # commit Package.swift, push tag, create the release

jobs:
  release-cli:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Rust toolchain (arm64 + x86_64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Import Developer ID signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERT_P12_PASSWORD }}

      - name: Store notarytool credentials
        run: |
          echo "${{ secrets.APPLE_NOTARY_KEY_P8 }}" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials cachebay-notary \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "${{ secrets.APPLE_NOTARY_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_NOTARY_ISSUER_ID }}"

      - name: Build + sign + notarize artifact bundle
        env:
          CACHEBAY_SIGN_ID: ${{ secrets.APPLE_SIGN_IDENTITY }}
          CACHEBAY_NOTARY_PROFILE: cachebay-notary
        run: scripts/build-cli-bundle.sh --sign

      - name: Pin Package.swift to this release
        id: pin
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="v$VERSION"
          CHECKSUM="$(cat Artifacts/cachebay-cli.artifactbundle.zip.sha256)"
          /usr/bin/sed -i '' \
            -e "s|^let defaultCLIMode = .*|let defaultCLIMode = \"release\"|" \
            -e "s|^let cliReleaseTag = .*|let cliReleaseTag = \"$TAG\"|" \
            -e "s|^let cliReleaseChecksum = .*|let cliReleaseChecksum = \"$CHECKSUM\"|" \
            Package.swift
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Pinned $TAG / $CHECKSUM"

      - name: Commit + tag
        run: |
          TAG="${{ steps.pin.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "chore(release): pin cachebay-cli artifact for $TAG"
          git push origin main
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release + upload bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.pin.outputs.tag }}"
          gh release create "$TAG" \
            Artifacts/cachebay-cli.artifactbundle.zip \
            --title "$TAG" \
            --notes "cachebay-cli $TAG — macOS-universal, signed + notarized. Used by the CachebayCodegen SwiftPM plugin."
