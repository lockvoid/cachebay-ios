name: Release cachebay-cli

# Tag-triggered: push a `vX.Y.Z` tag and this builds the macOS-universal
# `cachebay-cli` artifact bundle (ad-hoc signed — no Apple account needed; see
# scripts/build-cli-bundle.sh), publishes it on the GitHub Release, and pins
# Package.swift to it so consumers get the codegen plugin with zero install.
#
# The binaryTarget checksum must live IN the tagged commit's Package.swift, but
# it's only known after building — so we build, commit the checksum to main,
# then FORCE-MOVE the tag onto that commit. Pushes use GITHUB_TOKEN, whose
# events don't trigger new runs, so there's no loop.
#
# No secrets required. (workflow_dispatch is kept for manual re-runs.)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (manual re-run, e.g. 1.2.1)"
        required: true

permissions:
  contents: write   # commit Package.swift, move the tag, create the release

jobs:
  release-cli:
    runs-on: macos-15   # cargo + lipo + codesign + shasum; no Swift toolchain needed
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0   # need full history + tags to move the tag

      - name: Resolve version / tag
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"   # strip leading v from the pushed tag
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"   >> "$GITHUB_OUTPUT"

      - name: Add Rust targets (rustup is preinstalled on macOS runners)
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build artifact bundle (ad-hoc signed)
        run: scripts/build-cli-bundle.sh

      - name: Pin Package.swift, move tag, publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          ZIP="Artifacts/cachebay-cli.artifactbundle.zip"
          CHECKSUM="$(cat "$ZIP.sha256")"

          /usr/bin/sed -i '' \
            -e 's|^let defaultCLIMode = .*|let defaultCLIMode = "release"|' \
            -e "s|^let cliReleaseTag = .*|let cliReleaseTag = \"$TAG\"|" \
            -e "s|^let cliReleaseChecksum = .*|let cliReleaseChecksum = \"$CHECKSUM\"|" \
            Package.swift

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "chore(release): pin cachebay-cli artifact for $TAG"
          git push origin HEAD:main
          # Move the tag onto the checksum commit (GITHUB_TOKEN push → no re-run).
          git tag -f "$TAG"
          git push -f origin "$TAG"

          gh release create "$TAG" "$ZIP" \
            --title "$TAG" \
            --notes "cachebay-cli $TAG — macOS-universal, ad-hoc signed. Used by the CachebayCodegen SwiftPM plugin." \
            || gh release upload "$TAG" "$ZIP" --clobber
